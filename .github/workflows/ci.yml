name: CI

# Fills a gap docs/operations/operations.md has listed under Planned since
# the project started: typecheck/lint/test/build were previously run by
# hand before every deploy. This is that same gate, running automatically.
# It is also what apps/web's weekly-update pipeline checks the status of
# before ever deploying -- see docs/adr/0007-scheduler-and-deployment-pipeline.md.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fills the "Dependency/security update checks" gap
      # docs/operations/operations.md has listed under Planned since the
      # project started -- no pnpm audit or equivalent ran automatically
      # before this. Scoped to --prod: what actually ships in apps/web and
      # apps/game-server, not every dev tool's own transitive graph. One
      # known advisory is pre-ignored via pnpm-workspace.yaml's
      # auditConfig (see the comment there for why) -- a new advisory
      # anywhere else in the production dependency graph still fails this.
      - run: pnpm run audit

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
